[project]
name = "streetscan"
version = "0.1.0"
description = "Replication materials for 'Sampling Streets: Design-Based Inference for Street-Level Field Measurement'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Varun K.R." },
    { name = "Gaurav Sood" },
]
dependencies = [
    "geoestimate",
    "matplotlib",
    "networkx>=3.7",
    "numpy",
    "pandas",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/geosensing/streetscan"

[dependency-groups]
dev = [
    "black",
    "codespell",
    "flake8",
    "isort",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetscan"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
geoestimate = { git = "https://github.com/geosensing/geoestimate", rev = "b169b4d57e4334bedd6e77eaa00f63bdd882cd6d" }

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.lock,*.aux,*.bbl,*.log,*.fls,*.fdb_latexmk,./data/raw,./.venv,./.git"
ignore-words-list = "frome"
