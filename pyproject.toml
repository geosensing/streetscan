[project]
name = "streetscan"
version = "0.1.0"
description = "Replication materials for 'Sampling Streets: Design-Based Inference for Street-Level Field Measurement'"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Varun K.R." },
    { name = "Gaurav Sood" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyarrow",
]

[project.urls]
Repository = "https://github.com/geosensing/streetscan"

[dependency-groups]
dev = [
    "black",
    "flake8",
    "isort",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streetscan"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
