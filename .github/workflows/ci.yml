name: Analysis and manuscript

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install document tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern
      - run: make restore check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: manuscript
          path: ms/main.pdf
